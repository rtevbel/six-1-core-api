name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-core-api
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging
          labels: |
            org.opencontainers.image.title=six1-core-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-files/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to staging VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve image ref
        id: ref
        run: |
          NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "image_ref=ghcr.io/${NAME}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Trigger VPS deploy hook
        env:
          HOOK_URL: https://s2api.guoah.com/__six1-deploy
          HOOK_TOKEN: ${{ secrets.STAGING_DEPLOY_HOOK_TOKEN }}
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HOOK_TOKEN:?STAGING_DEPLOY_HOOK_TOKEN secret is required}"
          curl -fsS --retry 3 --retry-delay 5 -X POST "$HOOK_URL" \
            -H "Authorization: Bearer ${HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg stack core \
              --arg image_ref "$IMAGE_REF" \
              --arg ghcr_user "$GHCR_USER" \
              --arg ghcr_token "$GHCR_TOKEN" \
              '{stack:$stack,image_ref:$image_ref,ghcr_user:$ghcr_user,ghcr_token:$ghcr_token}')"
