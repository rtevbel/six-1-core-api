name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-core-api
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging
          labels: |
            org.opencontainers.image.title=six1-core-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-files/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to staging VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve image ref
        id: ref
        run: |
          NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "image_ref=ghcr.io/${NAME}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            test -n "${IMAGE_REF:?image_ref required}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if command -v six1-pull-up >/dev/null 2>&1; then
              six1-pull-up core "$IMAGE_REF"
            else
              cd /home/a529345/api.core.six1.guoah.com
              printf 'IMAGE_REF=%s\n' "$IMAGE_REF" > .env.image
              docker compose -p six1-core-api-uat -f docker-compose.yml pull six1-core-api
              docker compose -p six1-core-api-uat -f docker-compose.yml up -d --no-deps six1-core-api
              docker compose -p six1-core-api-uat -f docker-compose.yml ps six1-core-api
            fi
