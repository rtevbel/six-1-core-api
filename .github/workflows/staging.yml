name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-core-api
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging
          labels: |
            org.opencontainers.image.title=six1-core-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-files/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to staging VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    # Set repository/environment variable STAGING_DEPLOY_ENABLED=true after SSH secrets exist.
    if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Resolve image ref
        id: ref
        run: |
          NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "image_ref=ghcr.io/${NAME}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Pull and restart core on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            if [ -x /usr/local/bin/six1-ghcr-login ]; then
              /usr/local/bin/six1-ghcr-login
            fi
            /usr/local/bin/six1-pull-up core "${{ steps.ref.outputs.image_ref }}"
